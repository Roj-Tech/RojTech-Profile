<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>RojTech Book Reader</title>
    <style>
      :root {
        --bg: #020b14;
        --cyan: #00f5ff;
        --orange: #ff6b35;
        --text: #c8d8e8;
        --dim: #4a6278;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        height: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: center;
        padding: 10px 8px;
        padding-top: calc(10px + env(safe-area-inset-top));
        background: rgba(2, 11, 20, 0.96);
        border-bottom: 1px solid rgba(0, 245, 255, 0.18);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      button {
        min-height: 48px;
        min-width: 48px;
        padding: 8px 16px;
        border: 1px solid var(--cyan);
        background: rgba(0, 245, 255, 0.08);
        color: var(--cyan);
        font-size: 16px;
        border-radius: 4px;
        touch-action: manipulation;
      }
      button.primary {
        background: rgba(0, 245, 255, 0.22);
        font-weight: 700;
      }
      button:disabled { opacity: 0.35; }
      #pageInfo {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 14px;
        color: var(--cyan);
        min-width: 90px;
        text-align: center;
      }
      #title {
        width: 100%;
        text-align: center;
        font-size: 13px;
        color: var(--dim);
        padding: 0 10px 6px;
      }
      #status {
        text-align: center;
        padding: 48px 20px;
        color: var(--dim);
        font-size: 16px;
        line-height: 1.5;
      }
      #status.error { color: var(--orange); }
      #stage {
        height: calc(100% - 120px);
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        padding: 12px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background: #050b12;
      }
      #pageImg {
        display: block;
        width: 100%;
        max-width: 920px;
        height: auto;
        background: #fff;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }
      .hint {
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: var(--dim);
        padding: 0 8px 8px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button type="button" id="prevBtn">← Prev</button>
      <span id="pageInfo">…</span>
      <button type="button" id="nextBtn" class="primary">Next →</button>
    </div>
    <div id="title">Opening book…</div>
    <div class="hint">Swipe left / right · Works on iPhone · Read only</div>
    <div id="status">Loading book…</div>
    <div id="stage" hidden>
      <img id="pageImg" alt="Book page" draggable="false" />
    </div>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var id = params.get('id') || 'java-kurdish-rojtech';
        if (!/^[A-Za-z0-9_-]+$/.test(id)) {
          document.getElementById('status').textContent = 'Invalid book link.';
          document.getElementById('status').className = 'error';
          return;
        }

        var base = '/book-pages/' + encodeURIComponent(id) + '/';
        var statusEl = document.getElementById('status');
        var stageEl = document.getElementById('stage');
        var img = document.getElementById('pageImg');
        var pageInfo = document.getElementById('pageInfo');
        var titleEl = document.getElementById('title');
        var prevBtn = document.getElementById('prevBtn');
        var nextBtn = document.getElementById('nextBtn');

        var total = 0;
        var pageNum = 1;
        var touchX = null;

        function setStatus(msg, isError) {
          statusEl.hidden = !msg;
          statusEl.textContent = msg || '';
          statusEl.className = isError ? 'error' : '';
        }

        function updateButtons() {
          pageInfo.textContent = pageNum + ' / ' + total;
          prevBtn.disabled = pageNum <= 1;
          nextBtn.disabled = pageNum >= total;
        }

        function pageUrl(n) {
          return base + 'p-' + n + '.jpg';
        }

        function showPage(n) {
          if (!total) return;
          n = Math.max(1, Math.min(total, n));
          setStatus('Loading page ' + n + '…');
          var url = pageUrl(n);
          var probe = new Image();
          probe.onload = function () {
            img.src = url;
            pageNum = n;
            stageEl.hidden = false;
            setStatus('');
            updateButtons();
            try { stageEl.scrollTop = 0; } catch (e) {}
            if (n < total) {
              var warm = new Image();
              warm.src = pageUrl(n + 1);
            }
          };
          probe.onerror = function () {
            setStatus('Page ' + n + ' failed to load. Check Wi‑Fi and refresh.', true);
          };
          probe.src = url;
        }

        prevBtn.addEventListener('click', function () { showPage(pageNum - 1); });
        nextBtn.addEventListener('click', function () { showPage(pageNum + 1); });

        stageEl.addEventListener('touchstart', function (e) {
          touchX = e.changedTouches[0] ? e.changedTouches[0].clientX : null;
        }, { passive: true });
        stageEl.addEventListener('touchend', function (e) {
          if (touchX == null || !e.changedTouches[0]) return;
          var dx = e.changedTouches[0].clientX - touchX;
          touchX = null;
          if (Math.abs(dx) < 50) return;
          if (dx < 0) showPage(pageNum + 1);
          else showPage(pageNum - 1);
        }, { passive: true });

        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

        fetch(base + 'meta.json', { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            total = data.pages || 0;
            titleEl.textContent = data.title || 'RojTech Book';
            if (!total) throw new Error('No pages');
            showPage(1);
          })
          .catch(function (err) {
            console.error(err);
            setStatus('Could not open the book. Open this exact link on the same Wi‑Fi as the PC: /book-viewer.html?id=' + id, true);
          });
      })();
    </script>
  </body>
</html>
